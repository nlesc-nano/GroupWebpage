name: One-shot merge samad into main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Ivan Infante"
          git config user.email "iinfant76@gmail.com"

      - name: Merge samad with prepared resolutions
        run: |
          set -euo pipefail
          git fetch origin samad merge/samad-into-main
          if ! git merge origin/samad -m "Merge branch 'samad' into main"; then
            echo "Resolving known conflicts from merge/samad-into-main..."
            git checkout origin/merge/samad-into-main -- \
              package.json \
              src/routes/+page.svelte \
              src/routes/publications/+page.svelte \
              src/lib/components/SiteHeader.svelte \
              src/routes/+layout.svelte
            git add -A
            git commit --no-edit || git commit -m "Merge branch 'samad' into main"
          else
            git checkout origin/merge/samad-into-main -- \
              src/lib/components/SiteHeader.svelte \
              src/routes/+layout.svelte \
              package.json \
              src/routes/+page.svelte \
              src/routes/publications/+page.svelte
            git add -A
            git diff --cached --quiet || git commit -m "Apply Pages path helpers on samad UI"
          fi

      - name: Push to main
        run: git push origin HEAD:main

      - name: Remove one-shot workflow from main
        run: |
          if [ -f .github/workflows/merge-samad-once.yml ]; then
            git rm -f .github/workflows/merge-samad-once.yml
            git commit -m "Remove one-shot merge workflow"
            git push origin HEAD:main
          fi
