name: One-shot merge samad into main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Ivan Infante"
          git config user.email "iinfant76@gmail.com"

      - name: Merge samad and apply Pages path fixes
        run: |
          set -euo pipefail
          git fetch origin samad merge/samad-into-main

          if ! git merge origin/samad -m "Merge branch 'samad' into main"; then
            echo "Merge conflicts detected; applying prepared resolutions..."
            git checkout origin/merge/samad-into-main -- package.json || true
            git checkout --theirs -- \
              src/routes/+page.svelte \
              src/routes/publications/+page.svelte \
              src/lib/components/SiteHeader.svelte \
              src/routes/+layout.svelte \
              src/app.css \
              src/lib/content/site.ts \
              || true
            git add -A
          fi

          git checkout origin/merge/samad-into-main -- \
            package.json \
            src/lib/components/SiteHeader.svelte \
            src/routes/+layout.svelte \
            || true

          python3 << 'PY'
          from pathlib import Path

          def ensure_import(path: Path, needle: str, import_line: str) -> None:
              text = path.read_text()
              if needle in text:
                  return
              marker = "<script lang=\"ts\">\n"
              if marker not in text:
                  raise SystemExit(f"missing script tag in {path}")
              text = text.replace(marker, marker + import_line + "\n", 1)
              path.write_text(text)

          home = Path("src/routes/+page.svelte")
          pubs = Path("src/routes/publications/+page.svelte")

          ensure_import(home, "from '$app/paths'", "\timport { resolve, asset } from '$app/paths';")
          ensure_import(pubs, "from '$app/paths'", "\timport { resolve } from '$app/paths';")

          def patch(path: Path, replacements):
              text = path.read_text()
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text)

          patch(home, [
              ("src={logo.src}", "src={asset(logo.src)}"),
              ("src={member.photo}", "src={asset(member.photo)}"),
              ("src={item.logo}", "src={asset(item.logo)}"),
          ])
          text = home.read_text()
          text = text.replace('href="/publications">', "href={resolve('/publications/')}>")
          text = text.replace("href='/publications'>", "href={resolve('/publications/')}>")
          home.write_text(text)

          patch(pubs, [
              ('href="/"', "href={resolve('/')}"),
          ])

          print("patched", home, pubs)
          PY

          git add -A
          if [ -f .git/MERGE_HEAD ]; then
            git commit -m "Merge branch 'samad' into main" || git commit --no-edit
          else
            git diff --cached --quiet || git commit -m "Merge branch 'samad' into main"
          fi

      - name: Push to main
        run: git push origin HEAD:main

      - name: Remove one-shot workflow
        run: |
          if [ -f .github/workflows/merge-samad-once.yml ]; then
            git rm -f .github/workflows/merge-samad-once.yml
            git commit -m "Remove one-shot merge workflow" || true
            git push origin HEAD:main || true
          fi
