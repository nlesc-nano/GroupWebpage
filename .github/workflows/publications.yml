name: Update publications

# Rebuilds src/lib/content/publications.json from scopus_papers.bib and commits
# it back to main only when it changed. Pushes made with GITHUB_TOKEN do not
# trigger other workflows (so this cannot loop, and the push-triggered Pages
# deploy would not run), so after committing we explicitly dispatch the
# deploy workflow (workflow_dispatch is the documented exception to that rule).

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scopus_papers.bib
      - scripts/convert-publications.mjs

permissions:
  contents: write # commit publications.json
  actions: write # dispatch deploy-pages.yml

concurrency:
  group: publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build publications.json
        run: npm run publications:build

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet -- src/lib/content/publications.json; then
            echo "publications.json unchanged; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content/publications.json
          git commit -m "Update publications.json from scopus_papers.bib"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
